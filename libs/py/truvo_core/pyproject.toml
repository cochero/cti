[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truvo-core"
version = "0.1.0"
description = "TRUVO shared primitives: canonical JSON, hash-chain ledger entries"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["truvo_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
