[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truvo-events"
version = "0.1.0"
description = "TRUVO event backbone: registry-validated Avro produce/consume (Confluent wire format)"
requires-python = ">=3.9"
dependencies = [
    "confluent-kafka>=2.5",
    "fastavro>=1.9",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["truvo_events*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
