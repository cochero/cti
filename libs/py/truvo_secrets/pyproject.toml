[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truvo-secrets"
version = "0.1.0"
description = "TRUVO secrets layer: Vault-API KV client + secret-reference resolution"
requires-python = ">=3.9"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["truvo_secrets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
