[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truvo-objstore"
version = "0.1.0"
description = "TRUVO content-addressed object storage (S3/MinIO)"
requires-python = ">=3.9"
dependencies = ["minio>=7.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["truvo_objstore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
