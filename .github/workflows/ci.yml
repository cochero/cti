# TRUVO CI — Sprint S0 skeleton.
# Grows with the platform DoD (DEVELOPMENT_PLAN §1): image signing + SBOM
# gates activate when the registry lands (S0 exit); cross-tenant leak tests
# join in S1-S2; staging deploy on merge joins in S5-S6.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      # Pin ruff: an unpinned linter turns every ruff release into a
      # potential red build (0.16 added UP031 and broke a green commit).
      # Bump deliberately, with the ruleset in ruff.toml.
      - run: pip install ruff==0.16.0
      - run: ruff check libs/ services/ db/ core/ tests_e2e/

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Install packages under test
        # Local libs FIRST so internal names (truvo-*) resolve from the
        # repo, never from PyPI (dependency-confusion guard — threat T6).
        run: |
          pip install -e "libs/py/truvo_core[dev]" -e "libs/py/truvo_secrets[dev]" \
                      -e "libs/py/truvo_svcauth[dev]" -e "libs/py/truvo_events[dev]"
          pip install -e "services/ledger[dev]"
      - name: truvo_core tests (includes the replay-property test — a failure here is a sev-1)
        run: pytest libs/py/truvo_core -v
      - name: ledger-svc tests
        run: pytest services/ledger -v
      - name: Install extraction (for the injection suite)
        run: |
          pip install -e "libs/py/truvo_events[dev]" -e "libs/py/truvo_objstore[dev]"
          pip install -e "services/extraction[dev]"
      - name: Prompt-injection regression suite (§3.1-T2 — a slip here blocks release)
        working-directory: services/extraction
        run: python -m pytest tests -v

  leak-tests:
    # Cross-tenant RLS leak tests against real Postgres (platform DoD §1.3).
    # A failure here means tenant data can leak: sev-1, never overridable.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_DB: truvo
          POSTGRES_USER: truvo
          POSTGRES_PASSWORD: truvo-dev-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U truvo -d truvo"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TRUVO_TEST_DATABASE_URL: postgresql://truvo:truvo-dev-only@localhost:5432/truvo
      TRUVO_VAULT_ADDR: http://localhost:8200
      TRUVO_VAULT_TOKEN: truvo-dev-root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Start OpenBao (dev mode)
        run: |
          docker run -d --name openbao -p 8200:8200 --cap-add IPC_LOCK \
            quay.io/openbao/openbao:latest \
            server -dev -dev-root-token-id=truvo-dev-root -dev-listen-address=0.0.0.0:8200
          for i in $(seq 1 30); do
            curl -sf http://localhost:8200/v1/sys/health > /dev/null && break
            sleep 2
          done
      - run: pip install pytest psycopg2-binary
      - name: Apply migrations
        run: python db/migrate.py "$TRUVO_TEST_DATABASE_URL"
      - name: Run cross-tenant leak tests
        run: pytest db/tests -v
      - name: Install core service
        run: pip install -e "core[dev]"
      - name: Core unit tests (Django over test DB)
        working-directory: core
        env:
          TRUVO_DB_URL: postgresql://truvo:truvo-dev-only@localhost:5432/truvo
        run: python -m pytest tests -v
      - name: Apply Django migrations to the live DB (as admin role)
        working-directory: core
        env:
          TRUVO_DB_URL: postgresql://truvo:truvo-dev-only@localhost:5432/truvo
        run: python manage.py migrate --noinput
      - name: Core live tests (RLS through Django as truvo_app)
        working-directory: core
        run: python -m pytest tests_live -p no:django -v
      - name: Install services
        run: |
          pip install -e "libs/py/truvo_core[dev]" -e "libs/py/truvo_events[dev]"
          pip install -e "libs/py/truvo_secrets[dev]" -e "libs/py/truvo_svcauth[dev]"
          pip install -e "services/ledger[dev]" -e "services/provenance[dev]"
          pip install -e "services/identity-telemetry[dev]"
          pip install -e "services/entity-resolution[dev]" -e "services/graph[dev]"
          pip install -e "services/scoring[dev]" -e "services/eval-harness[dev]"
          pip install -e "services/detection-factory[dev]" \
                      -e "services/response-orchestrator[dev]"
      - name: Secrets + svcauth lib tests (live vault)
        run: |
          python -m pytest libs/py/truvo_secrets -v
          python -m pytest libs/py/truvo_svcauth -v
      - name: Ledger live tests (Postgres store, tamper + anchor detection)
        working-directory: services/ledger
        run: python -m pytest tests_live -v
      - name: Identity-telemetry live tests (sync, snapshot, blast radius, RLS)
        working-directory: services/identity-telemetry
        run: python -m pytest tests_live -v
      - name: Entity-resolution tests (alias clustering unit + live)
        working-directory: services/entity-resolution
        run: |
          python -m pytest tests -v
          python -m pytest tests_live -v
      - name: Graph tests (attack-path traversal, cycle safety)
        working-directory: services/graph
        run: python -m pytest tests_live -v
      - name: Scoring tests (deterministic engine unit + live decomposition/ledger)
        working-directory: services/scoring
        run: |
          python -m pytest tests -v
          python -m pytest tests_live -v
      - name: Eval-harness tests (calibration unit + backtest live)
        working-directory: services/eval-harness
        run: |
          python -m pytest tests -v
          python -m pytest tests_live -v
      - name: Detection-factory tests (Sigma detonation/FP-budget unit + live, T3 guard)
        working-directory: services/detection-factory
        run: |
          python -m pytest tests -v
          python -m pytest tests_live -v
      - name: Response-orchestrator tests (guardrails safety spec unit + live)
        working-directory: services/response-orchestrator
        run: |
          python -m pytest tests -v
          python -m pytest tests_live -v
      - name: Provenance tests (SS7.3 floor unit + live; consumer test skips without Kafka)
        working-directory: services/provenance
        run: |
          python -m pytest tests -v
          python -m pytest tests_live -v

  event-roundtrip:
    # S1-S2 exit: registry-validated event round-trips through the backbone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 9092:9092 -p 18081:18081 \
            redpandadata/redpanda:latest redpanda start --smp=1 --memory=1G \
            --mode=dev-container \
            --kafka-addr=external://0.0.0.0:9092 \
            --advertise-kafka-addr=external://localhost:9092 \
            --schema-registry-addr=external://0.0.0.0:18081
          for i in $(seq 1 30); do
            docker exec redpanda rpk cluster health --exit-when-healthy && break
            sleep 2
          done
      - run: pip install -e "libs/py/truvo_events[dev]"
      - name: Round-trip test
        env:
          TRUVO_KAFKA_BOOTSTRAP: localhost:9092
          TRUVO_SCHEMA_REGISTRY: http://localhost:18081
        run: pytest libs/py/truvo_events -v

  pipeline-e2e:
    # Phase 2 exit: collector -> extraction -> provenance across real
    # process boundaries, with pipeline-level injection defense.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_DB: truvo
          POSTGRES_USER: truvo
          POSTGRES_PASSWORD: truvo-dev-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U truvo -d truvo"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TRUVO_TEST_DATABASE_URL: postgresql://truvo:truvo-dev-only@localhost:5432/truvo
      TRUVO_KAFKA_BOOTSTRAP: localhost:9092
      TRUVO_SCHEMA_REGISTRY: http://localhost:18081
      TRUVO_OBJSTORE_ENDPOINT: localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Start Redpanda + MinIO
        run: |
          docker run -d --name redpanda -p 9092:9092 -p 18081:18081 \
            redpandadata/redpanda:latest redpanda start --smp=1 --memory=1G \
            --mode=dev-container --kafka-addr=external://0.0.0.0:9092 \
            --advertise-kafka-addr=external://localhost:9092 \
            --schema-registry-addr=external://0.0.0.0:18081
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=truvo -e MINIO_ROOT_PASSWORD=truvo-dev-only \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            docker exec redpanda rpk cluster health --exit-when-healthy && break
            sleep 2
          done
      - name: Apply SQL migrations
        run: |
          pip install psycopg2-binary
          python db/migrate.py "$TRUVO_TEST_DATABASE_URL"
      - name: Install pipeline packages
        run: |
          pip install -e "libs/py/truvo_core[dev]" -e "libs/py/truvo_events[dev]" \
                      -e "libs/py/truvo_objstore[dev]"
          pip install -e "services/collector[dev]" -e "services/extraction[dev]" \
                      -e "services/provenance[dev]"
      - name: Object store tests (content-addressing, self-verification)
        run: python -m pytest libs/py/truvo_objstore -v
      - name: End-to-end pipeline (collect -> extract -> corroborate)
        run: python -m pytest tests_e2e -v

  build-images:
    runs-on: ubuntu-latest
    needs: [lint, test-python, leak-tests, event-roundtrip, pipeline-e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Build ledger image
        run: docker build -f services/ledger/Dockerfile -t truvo/ledger:${{ github.sha }} .
      # TODO(S0-exit): push to registry + cosign sign + CycloneDX SBOM attest.
      # The DoD gate: no unsigned image is deployable (DEVELOPMENT_PLAN §1.3).
