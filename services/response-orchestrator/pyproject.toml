[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truvo-response-orchestrator"
version = "0.1.0"
description = "TRUVO response-orchestrator: 3-tier execution matrix + circuit breakers"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "psycopg2-binary>=2.9", "truvo-core"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
