[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truvo-collector"
version = "0.1.0"
description = "TRUVO collector-svc: acquisition + content-addressed storage + rawdoc emission"
requires-python = ">=3.9"
dependencies = [
    "confluent-kafka>=2.5",
    "requests>=2.31",
    "truvo-events",
    "truvo-objstore",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests_live"]
