[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truvo-entity-resolution"
version = "0.1.0"
description = "TRUVO entity-resolution-svc: alias clustering + canonical entities"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "psycopg2-binary>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
