[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truvo-graph"
version = "0.1.0"
description = "TRUVO graph-svc: threat knowledge graph (edges + attack-path traversal)"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "psycopg2-binary>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests_live"]
