[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truvo-eval-harness"
version = "0.1.0"
description = "TRUVO eval-harness: backtesting + calibration (measure or remove, §9)"
requires-python = ">=3.9"
dependencies = ["psycopg2-binary>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
