{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: truvo
    truvo.io/profile: {{ $.Values.global.profile }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- if $.Values.global.spiffe.enabled }}
        spiffe.io/spiffe-id: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      containers:
        - name: {{ $name }}
          image: {{ $.Values.global.image.registry }}/{{ $name }}:{{ $.Values.global.image.tag }}
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
{{ include "truvo.commonEnv" $ | indent 12 }}
            {{- if $svc.dbUrlSecret }}
            - name: TRUVO_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $svc.dbUrlSecret }}
                  key: url
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml $.Values.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
{{- end }}
{{- end }}
