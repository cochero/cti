# The extraction zone's ONLY door to a hosted LLM provider (security
# review C1). Extraction runs on an internal (no-internet) network; this
# proxy is the single multi-homed bridge, forwarding exactly one upstream
# (the configured provider host). Extraction therefore cannot exfiltrate
# to anywhere except the provider it was given.
#
# Upstream host is configurable per deployment via envsubst at container
# start (see compose: LLM_UPSTREAM_HOST). Path, Authorization header, and
# body pass through untouched — the adapter sees a normal OpenAI-compatible
# API on http://llm-egress.

server {
    listen 80;

    # deny everything that is not the chat/completions call shape
    location = /healthz { return 200 "ok\n"; }

    location / {
        proxy_pass https://${LLM_UPSTREAM_HOST};
        proxy_ssl_server_name on;
        proxy_ssl_name ${LLM_UPSTREAM_HOST};
        proxy_set_header Host ${LLM_UPSTREAM_HOST};
        proxy_pass_request_headers on;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        # response-size backstop mirrors the adapter's cap (defense in depth)
        proxy_buffer_size 16k;
        proxy_max_temp_file_size 0;
    }
}
